name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: qr-backend — lint & build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qr-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: qr-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # prisma generate solo lee el schema, no se conecta a la BD —
        # el valor de DATABASE_URL no necesita ser real aquí.
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # NOTA: no se ejecuta `npm test` todavía — los tests existentes (tests/auth.test.js)
      # requieren una conexión real a la base de datos (el backend se conecta a Prisma al
      # arrancar y termina el proceso si falla). Ejecutarlos aquí implicaría usar la BD de
      # producción desde CI (riesgo de escribir datos de prueba reales) o levantar una BD
      # de prueba dedicada, que es el alcance del Sprint C (Jest >60% cobertura).
